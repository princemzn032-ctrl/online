services:
  - type: web
    name: quizmaster
    env: node
    plan: free
    buildCommand: npm ci && npm run build && npm --prefix server ci
    startCommand: npm --prefix server run seed && npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
